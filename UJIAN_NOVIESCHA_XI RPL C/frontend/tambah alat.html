<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambah Alat - Peminjaman Alat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#334155}
header{background:white;padding:16px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0}
.brand{font-size:22px;font-weight:bold;color:#d97706}
.layout{display:flex;min-height:calc(100vh - 60px)}aside{width:220px;background:white;padding:20px;border-right:1px solid #e2e8f0}
aside a{display:block;padding:12px;margin:5px 0;text-decoration:none;color:#475569;border-radius:8px}
aside a:hover,aside a.active{background:#fef3c7;color:#92400e}
main{padding:28px;flex:1;min-width:0}h1{margin-top:0;color:#1e293b}
button{border:0;border-radius:7px;padding:10px 14px;background:#d97706;color:white;cursor:pointer;font-size:14px}
button:hover{opacity:.88}.secondary{background:#64748b}
.panel{background:white;padding:20px;border:1px solid #e2e8f0;border-radius:12px;margin:18px 0;max-width:600px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;margin:6px 0 12px;font:inherit}
label{font-weight:500;font-size:14px}
@media(max-width:700px){.layout{display:block}aside{width:100%;display:flex;overflow:auto;padding:8px}aside a{white-space:nowrap}main{padding:16px}.panel{padding:12px}}
</style>
</head>
<body>
<header><div class="brand">Peminjaman Alat</div></header>
<div class="layout">
<aside>
    <a href="dashboard.html">Dashboard</a>
    <a href="data kategori.html">Data Kategori</a>
    <a href="data alat.html">Data Alat</a>
    <a href="tambah alat.html" class="active">Tambah Alat</a>
    <a href="peminjaman.html">Peminjaman</a>
    <a href="tambah peminjaman.html">Tambah Peminjaman</a>
</aside>
<main>
    <h1>Tambah Alat Baru</h1>
    <section class="panel">
        <form onsubmit="simpanAlat(event)">
            <label>Nama Alat</label>
            <input type="text" id="namaAlat" required placeholder="Contoh: Laptop">
            <label>Stok</label>
            <input type="number" id="stok" required min="0" placeholder="Contoh: 10">
            <label>Lokasi Penyimpanan</label>
            <input type="text" id="lokasi" required placeholder="Contoh: Lemari Jaringan A">
            <label>Kategori</label>
            <select id="kategori" required><option value="">-- Pilih Kategori --</option></select>
            <label>Kondisi</label>
            <input type="text" id="kondisi" required placeholder="Contoh: Baik, masih berfungsi normal">
            <div style="margin-top:20px">
                <button type="submit">Simpan Alat</button>
                <button type="button" class="secondary" onclick="window.location.href='data alat.html'">Batal</button>
            </div>
        </form>
    </section>
</main>
</div>

<script>
const API_ALAT = "http://localhost:3000/api/alat";
const API_KATEGORI = "http://localhost:3000/api/kategori";

function ekstrakArray(hasil) {
    if (Array.isArray(hasil)) return hasil;
    if (hasil && Array.isArray(hasil.data)) return hasil.data;
    if (hasil && Array.isArray(hasil.rows)) return hasil.rows;
    return [];
}

async function loadKategori() {
    const selectKategori = document.getElementById("kategori");
    try {
        const response = await fetch(API_KATEGORI);
        const data = ekstrakArray(await response.json());
        if (data.length === 0) {
            selectKategori.innerHTML = '<option value="">(Belum ada kategori)</option>'; return;
        }
        selectKategori.innerHTML = '<option value="">-- Pilih Kategori --</option>';
        data.forEach(kategori => {
            const option = document.createElement("option");
            option.value = kategori.id_kategori; option.textContent = kategori.nama_kategori;
            selectKategori.add(option);
        });
    } catch (error) {
        selectKategori.innerHTML = '<option value="">Gagal memuat kategori</option>';
    }
}

async function simpanAlat(e) {
    e.preventDefault();
    const dataAlat = {
        nama_alat: document.getElementById("namaAlat").value.trim(),
        stok: Number(document.getElementById("stok").value),
        lokasi: document.getElementById("lokasi").value.trim(),
        id_kategori: Number(document.getElementById("kategori").value),
        kondisi: document.getElementById("kondisi").value.trim()
    };
    try {
        const response = await fetch(API_ALAT, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dataAlat)
        });
        if (response.ok) {
            alert("Data alat berhasil ditambahkan!"); window.location.href = "data alat.html";
        } else { alert("Gagal menyimpan alat. Pastikan backend punya rute POST."); }
    } catch (error) { alert("Terjadi kesalahan jaringan."); }
}

document.addEventListener("DOMContentLoaded", loadKategori);
</script>
</body>
</html>
