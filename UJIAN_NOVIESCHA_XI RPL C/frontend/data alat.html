<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Alat - Peminjaman Alat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#334155}
header{background:white;padding:16px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0}
.brand{font-size:22px;font-weight:bold;color:#d97706}
.layout{display:flex;min-height:calc(100vh - 60px)}aside{width:220px;background:white;padding:20px;border-right:1px solid #e2e8f0}
aside a{display:block;padding:12px;margin:5px 0;text-decoration:none;color:#475569;border-radius:8px}
aside a:hover,aside a.active{background:#fef3c7;color:#92400e}
main{padding:28px;flex:1;min-width:0}h1{margin-top:0;color:#1e293b}
button{border:0;border-radius:7px;padding:10px 14px;background:#d97706;color:white;cursor:pointer;font-size:14px}
button:hover{opacity:.88}.danger{background:#dc2626}.secondary{background:#64748b}
.panel{background:white;padding:20px;border:1px solid #e2e8f0;border-radius:12px;margin:18px 0}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;margin:6px 0 12px;font:inherit}
label{font-weight:500;font-size:14px}
table{width:100%;border-collapse:collapse;background:white}
th,td{text-align:left;padding:13px;border-bottom:1px solid #e2e8f0}
th{background:#fffbeb;color:#92400e}
.table-wrap{overflow-x:auto}th{white-space:nowrap}.text-center{text-align:center}
.actions{display:flex;gap:7px;justify-content:center;}
.hidden{display:none;}
@media(max-width:700px){.layout{display:block}aside{width:100%;display:flex;overflow:auto;padding:8px}aside a{white-space:nowrap}main{padding:16px}.panel{overflow:auto}}
</style>
</head>
<body>
<header><div class="brand">Peminjaman Alat</div></header>
<div class="layout">
<aside>
    <a href="dashboard.html">Dashboard</a>
    <a href="data kategori.html">Data Kategori</a>
    <a href="data alat.html" class="active">Data Alat</a>
    <a href="tambah alat.html">Tambah Alat</a>
    <a href="peminjaman.html">Peminjaman</a>
    <a href="tambah peminjaman.html">Tambah Peminjaman</a>
</aside>
<main>
    <h1>Data Alat</h1>

    <!-- FORM EDIT (Disembunyikan secara default) -->
    <section id="panelEdit" class="panel hidden" style="border-left:4px solid #d97706;">
        <h3>Edit Data Alat</h3>
        <form onsubmit="simpanEditAlat(event)">
            <input type="hidden" id="editIdAlat">
            <label>Nama Alat</label>
            <input type="text" id="editNamaAlat" required>
            <label>Stok</label>
            <input type="number" id="editStok" required min="0">
            <label>Lokasi</label>
            <input type="text" id="editLokasi" required>
            <label>Kategori</label>
            <select id="editKategori" required></select>
            <label>Kondisi</label>
            <input type="text" id="editKondisi" required>
            <div style="margin-top:10px;">
                <button type="submit" style="background:#16a34a;">Simpan Perubahan</button>
                <button type="button" class="secondary" onclick="tutupFormEdit()">Batal</button>
            </div>
        </form>
    </section>

    <section class="panel">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th class="text-center">No.</th><th>Nama Alat</th><th>Kategori</th><th class="text-center">Stok</th><th>Kondisi</th><th>Lokasi</th><th class="text-center">Aksi</th></tr>
                </thead>
                <tbody id="tabelAlat"><tr><td colspan="7" class="text-center">Memuat data...</td></tr></tbody>
            </table>
        </div>
    </section>
</main>
</div>

<script>
const API_ALAT = "http://localhost:3000/api/alat";
const API_KATEGORI = "http://localhost:3000/api/kategori";
let petaKategori = {};
let cacheAlat = [];

function ekstrakArray(hasil) {
    if (Array.isArray(hasil)) return hasil;
    if (hasil && Array.isArray(hasil.data)) return hasil.data;
    if (hasil && Array.isArray(hasil.rows)) return hasil.rows;
    return [];
}

async function loadKategori() {
    try {
        const res = await fetch(API_KATEGORI);
        const list = ekstrakArray(await res.json());
        
        // Simpan ke map untuk tampilan tabel
        list.forEach(k => { petaKategori[k.id_kategori] = k.nama_kategori; });

        // Isi dropdown form edit
        const select = document.getElementById("editKategori");
        select.innerHTML = '<option value="">-- Pilih Kategori --</option>';
        list.forEach(k => {
            const opt = document.createElement("option");
            opt.value = k.id_kategori;
            opt.textContent = k.nama_kategori;
            select.add(opt);
        });
    } catch (e) { console.warn("Gagal load kategori", e); }
}

async function ambilDataAlat() {
    const tabelBody = document.getElementById("tabelAlat");
    try {
        const response = await fetch(API_ALAT);
        cacheAlat = ekstrakArray(await response.json());

        if (cacheAlat.length > 0) {
            tabelBody.innerHTML = cacheAlat.map((alat, i) => {
                const namaKategori = alat.nama_kategori || petaKategori[alat.id_kategori] || "-";
                return `
                    <tr>
                        <td class="text-center">${i + 1}</td>
                        <td style="white-space:nowrap;">${alat.nama_alat ?? "-"}</td>
                        <td>${namaKategori}</td>
                        <td class="text-center">${alat.stok ?? 0}</td>
                        <td>${alat.kondisi ?? "-"}</td>
                        <td>${alat.lokasi ?? "-"}</td>
                        <td class="text-center">
                            <div class="actions">
                                <button onclick="bukaEditAlat(${alat.id_alat})">Edit</button>
                                <button class="danger" onclick="hapusAlat(${alat.id_alat})">Hapus</button>
                            </div>
                        </td>
                    </tr>`;
            }).join("");
        } else {
            tabelBody.innerHTML = '<tr><td colspan="7" class="text-center">Belum ada data alat.</td></tr>';
        }
    } catch (error) {
        tabelBody.innerHTML = '<tr><td colspan="7" class="text-center" style="color:red;">Gagal memuat data.</td></tr>';
    }
}

// ================= FUNGSI EDIT =================
function bukaEditAlat(id) {
    const alat = cacheAlat.find(a => a.id_alat === id);
    if (!alat) return;

    // Isi form
    document.getElementById("editIdAlat").value = alat.id_alat;
    document.getElementById("editNamaAlat").value = alat.nama_alat || "";
    document.getElementById("editStok").value = alat.stok || 0;
    document.getElementById("editLokasi").value = alat.lokasi || "";
    document.getElementById("editKondisi").value = alat.kondisi || "";
    document.getElementById("editKategori").value = alat.id_kategori || "";

    // Tampilkan form
    document.getElementById("panelEdit").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function tutupFormEdit() {
    document.getElementById("panelEdit").classList.add("hidden");
    document.getElementById("editIdAlat").value = "";
}

async function simpanEditAlat(e) {
    e.preventDefault();
    const id = document.getElementById("editIdAlat").value;
    
    const dataBaru = {
        nama_alat: document.getElementById("editNamaAlat").value.trim(),
        stok: Number(document.getElementById("editStok").value),
        lokasi: document.getElementById("editLokasi").value.trim(),
        id_kategori: Number(document.getElementById("editKategori").value),
        kondisi: document.getElementById("editKondisi").value.trim()
    };

    try {
        const res = await fetch(`${API_ALAT}/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dataBaru)
        });
        if (res.ok) {
            alert("Data alat berhasil diupdate!");
            tutupFormEdit();
            ambilDataAlat(); // Refresh tabel
        } else {
            alert("Gagal mengupdate data alat.");
        }
    } catch (err) { alert("Terjadi kesalahan jaringan."); }
}
// ===============================================

async function hapusAlat(id) {
    if (!confirm("Yakin ingin menghapus alat ini?")) return;
    try {
        const response = await fetch(`${API_ALAT}/${id}`, { method: "DELETE" });
        if (response.ok) { alert("Alat dihapus!"); ambilDataAlat(); }
        else { alert("Gagal menghapus. Pastikan alat tidak sedang dipinjam."); }
    } catch (error) { alert("Error jaringan."); }
}

document.addEventListener("DOMContentLoaded", async () => {
    await loadKategori();
    ambilDataAlat();
});
</script>
</body>
</html>
